spring:
  application:
    name: hms-backend
  datasource:
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_USERNAME:hms}
    password: ${HMS_DB_PASSWORD:hms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${HMS_API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

hms:
  security:
    enforce: ${HMS_SECURITY_ENFORCE:true}
  cors:
    allowed-origins: ${HMS_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  notifications:
    provider: ${HMS_NOTIFICATION_PROVIDER:mock}
    dispatch-enabled: ${HMS_NOTIFICATION_DISPATCH_ENABLED:false}
    dispatch-interval-ms: ${HMS_NOTIFICATION_DISPATCH_INTERVAL_MS:30000}
  public-rate-limit:
    max-requests: ${HMS_PUBLIC_RATE_LIMIT_MAX:30}
    window-ms: ${HMS_PUBLIC_RATE_LIMIT_WINDOW_MS:60000}
